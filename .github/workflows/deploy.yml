name: Deploy to Cloud Run

on:
  push:
    branches:
      - Carlos
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Configurar Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }} | base64 --decode
          export_default_credentials: true

      # 3) Comprobación de la autenticación
      - name: Authenticate with service account
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > $GITHUB_WORKSPACE/key.json
          gcloud auth activate-service-account --key-file=$GITHUB_WORKSPACE/key.json

      # 4) Login a Docker Hub (para evitar rate limit)
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5) Vuelve a configurar la autenticación de Docker
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # 6) Build y push de la imagen
      - name: Build and push Docker image
        run: |
          IMAGE="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/argoos-repo/argoos-agent:latest"
          docker build -t $IMAGE .
          docker push $IMAGE

      # 7) Desplegar a Cloud Run
      - name: Deploy to Cloud Run
        run: |
          IMAGE="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/argoos-repo/argoos-agent:latest"
          gcloud run deploy argoos-agent \
            --image $IMAGE \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated \
            --service-account argoos-run-sa@${{ secrets.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-env-vars GCP_PROJECT=${{ secrets.GCP_PROJECT }},ENV=cloud \
            --set-secrets ORCHESTRATOR_API_KEY=ORCHESTRATOR_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --memory 20Gi \
            --cpu 6 \
            --concurrency 2 \
            --timeout 600
